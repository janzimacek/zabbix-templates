    template: Synology NAS by SNMP - Dashboard 2 disks
    name: Synology NAS by SNMP - Dashboard 2 disks
    description: Final 2-disk dashboard presentation template for the universal Synology Core. Same visual design as the validated 8-disk v8 dashboard, reduced to two physical disks. Core remains authoritative for LLD and triggers.
    groups:
    - name: Templates/Storage
    templates:
    - name: Synology NAS by SNMP - Core
    items:
    - uuid: a67c0830197a49018e66c3d78dbecbf7
      name: 'Dashboard: Drive 1 health'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.6574.2.1.1.13.0
      key: dashboard.disk.health[0]
      delay: 5m
      history: 7d
      valuemap:
        name: Synology disk health
      description: Dashboard-only health probe. Core LLD remains authoritative for monitoring and triggers.
    - uuid: 93e2ae9a115b42d88870c06be8678f13
      name: 'Dashboard: Drive 2 health'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.6574.2.1.1.13.1
      key: dashboard.disk.health[1]
      delay: 5m
      history: 7d
      valuemap:
        name: Synology disk health
      description: Dashboard-only health probe. Core LLD remains authoritative for monitoring and triggers.
    - uuid: e76437d2d0fc40ae895a25ce45b3dc6c
      name: Ping response time
      type: SIMPLE
      key: icmppingsec[,3]
      delay: 30s
      history: 30d
      value_type: FLOAT
      units: s
      description: ICMP response time. Standard Zabbix simple check, 3 packets per test.
