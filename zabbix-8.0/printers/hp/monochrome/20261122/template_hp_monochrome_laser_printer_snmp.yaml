            name: reference
            value: TONER
  graphs:
  - uuid: 8a496d0840fe476586ef7d9458463883
    name: 'Printer: Printed pages total'
    show_work_period: 'NO'
    show_triggers: 'NO'
    ymin_type_1: FIXED
    graph_items:
    - color: 0040FF
      item:
        host: HP Monochrome Laser Printer by SNMP
        key: printer.pages.total
  - uuid: 9e6dc2de6f9f438c81ffd49ce9db54c5
    name: 'Printer: Ping response time'
    show_work_period: 'NO'
    show_triggers: 'NO'
    ymin_type_1: FIXED
    graph_items:
    - color: 1E88E5
      item:
        host: HP Monochrome Laser Printer by SNMP
        key: icmppingsec[,3]
