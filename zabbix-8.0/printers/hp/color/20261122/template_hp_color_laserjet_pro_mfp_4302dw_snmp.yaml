      delay: 5m
      history: 90d
      value_type: FLOAT
      units: '%'
      params: 100 * last(//printer.toner.cyan.level) / last(//printer.toner.cyan.max)
      triggers:
      - uuid: 86699f8ff24d422980c0d920b760210e
        expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.cyan.percent)<{$PRINTER.TONER.WARN} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.cyan.percent)>=0
        name: 'Printer: Cyan toner is low (<{$PRINTER.TONER.WARN}%)'
        priority: WARNING
        dependencies:
        - name: 'Printer: Cyan toner is critically low (<{$PRINTER.TONER.CRIT}%)'
          expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.cyan.percent)<{$PRINTER.TONER.CRIT} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.cyan.percent)>=0
        tags:
        - tag: component
          value: toner
        - tag: color
          value: cyan
      - uuid: c5a3e5aa181747658728efa6b7898505
        expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.cyan.percent)<{$PRINTER.TONER.CRIT} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.cyan.percent)>=0
        name: 'Printer: Cyan toner is critically low (<{$PRINTER.TONER.CRIT}%)'
        priority: HIGH
