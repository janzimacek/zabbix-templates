zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: 482475f473b64b2f85ca54d72a08033a
    name: Templates/Network devices
  templates:
  - uuid: a91a638027804643880acb5e929fa834
    template: HP Color LaserJet Pro MFP 4302dw by SNMP
    name: HP Color LaserJet Pro MFP 4302dw by SNMP
    description: Zabbix 8.0 SNMP template for HP Color LaserJet Pro MFP 4302dw, based on the validated HP monochrome v5 template. Printer-MIB LLD discovers Black, Cyan, Magenta and Yellow cartridges and optional additional consumables without hard-coded supply indexes.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 10e94e7c9f47481f8b29818c72354dc2
      name: ICMP availability
      type: SIMPLE
      key: icmpping
      delay: 30s
      history: 90d
      valuemap:
        name: ICMP availability
      triggers:
      - uuid: e9c8b6ea4d2e4c74804c5de5e9459aba
        expression: max(/HP Color LaserJet Pro MFP 4302dw by SNMP/icmpping,3m)=0
        name: Printer is unreachable by ICMP
        priority: HIGH
        tags:
        - tag: component
          value: availability
    - uuid: 519fbe3f5de943468b4cc655aac37f39
      name: Ping response time
      type: SIMPLE
      key: icmppingsec[,3]
      delay: 30s
      history: 90d
      value_type: FLOAT
      units: s
    - uuid: d7940713c5344b1b86a9419a0794537c
      name: System name
      type: SNMP_AGENT
      key: printer.system.name
      delay: 1h
      history: 90d
      snmp_oid: 1.3.6.1.2.1.1.5.0
      value_type: CHAR
    - uuid: ee4e7945fc234a0f8e393ae634631e82
      name: System description
      type: SNMP_AGENT
      key: printer.system.description
      delay: 1h
      history: 90d
      snmp_oid: 1.3.6.1.2.1.1.1.0
      value_type: TEXT
    - uuid: 556a47e5febe4f4287e837ad82861421
      name: SNMP uptime
      type: SNMP_AGENT
      key: printer.system.uptime
      delay: 5m
      history: 90d
      snmp_oid: 1.3.6.1.2.1.1.3.0
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
    - uuid: 3c4223afbde348ac8861eb03155070eb
      name: Printed pages total
      type: SNMP_AGENT
      key: printer.pages.total
      delay: 5m
      history: 90d
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      units: pages
    - uuid: 27326d79405d418980d02fe4b6296935
      name: Printed pages formatted
      type: DEPENDENT
      key: printer.pages.total.formatted
      delay: '0'
      history: 90d
      value_type: CHAR
      master_item:
        key: printer.pages.total
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      description: Dashboard display value with a space as the thousands separator. The numeric printer.pages.total item remains authoritative for graphs and calculations.
    - uuid: c798d3613de940c18a3f795a11f51be7
      name: 'Toner Black: Maximum capacity'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.1
      key: printer.toner.black.max
      delay: 1h
      history: 90d
    - uuid: 41bf1bf4d0a842648111d9d67593dfb5
      name: 'Toner Black: Current level'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
      key: printer.toner.black.level
      delay: 5m
      history: 90d
    - uuid: 0472f0524e464f618a2d5194fadaf773
      name: 'Toner Black: Remaining'
      type: CALCULATED
      key: printer.toner.black.percent
      delay: 5m
      history: 90d
      value_type: FLOAT
      units: '%'
      params: 100 * last(//printer.toner.black.level) / last(//printer.toner.black.max)
      triggers:
      - uuid: 21e298912c5547c88dea9c8703707ec8
        expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.black.percent)<{$PRINTER.TONER.WARN} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.black.percent)>=0
        name: 'Printer: Black toner is low (<{$PRINTER.TONER.WARN}%)'
        priority: WARNING
        dependencies:
        - name: 'Printer: Black toner is critically low (<{$PRINTER.TONER.CRIT}%)'
          expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.black.percent)<{$PRINTER.TONER.CRIT} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.black.percent)>=0
        tags:
        - tag: component
          value: toner
        - tag: color
          value: black
      - uuid: 5d98e25e78e9432e82b109b4f680bf13
        expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.black.percent)<{$PRINTER.TONER.CRIT} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.black.percent)>=0
        name: 'Printer: Black toner is critically low (<{$PRINTER.TONER.CRIT}%)'
        priority: HIGH
        tags:
        - tag: component
          value: toner
        - tag: color
          value: black
    - uuid: ff2d53bbfdd544308f73c1be69569c91
      name: 'Toner Cyan: Maximum capacity'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
      key: printer.toner.cyan.max
      delay: 1h
