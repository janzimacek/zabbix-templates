      - uuid: 6f10b34433734e458b559fa7bedbe5f1
        expression: last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.magenta.percent)<{$PRINTER.TONER.CRIT} and last(/HP Color LaserJet Pro MFP 4302dw by SNMP/printer.toner.magenta.percent)>=0
