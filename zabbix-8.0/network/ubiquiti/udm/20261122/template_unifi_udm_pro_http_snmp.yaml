    valuemaps:
    - uuid: 04074daa05b74912a00158c92c118e59
      name: ICMP availability
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
    - uuid: 36f2e76da8e045029299fb217b9872c7
      name: IF-MIB interface status
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
      - value: '4'
        newvalue: Unknown
      - value: '5'
        newvalue: Dormant
      - value: '6'
        newvalue: Not present
      - value: '7'
        newvalue: Lower layer down
    description: Monitors UniFi UDM Pro and adopted UniFi devices using the official local UniFi Network API, ICMP and SNMP. Configure all required
      host macros before enabling the host. Tested with Zabbix 8.0 and UniFi Network 10.6.x.
    tags:
    - tag: class
      value: network
    - tag: target
      value: unifi-udm-pro
  triggers:
  - uuid: 6a6e77cf00244dc59d82977a515eb32b
    expression: 'count(/UniFi UDM Pro by HTTP and SNMP/unifi.wan1.status,#4,"ne","1")=4

      and

      count(/UniFi UDM Pro by HTTP and SNMP/unifi.wan2.status,#4,"ne","1")=4

      '
    name: 'UDM Pro: Both WAN physical links are down'
    priority: DISASTER
    dependencies:
    - name: 'UDM Pro: Device is unreachable by ICMP'
      expression: max(/UniFi UDM Pro by HTTP and SNMP/icmpping[{$UNIFI.HOST}],2m)=0
